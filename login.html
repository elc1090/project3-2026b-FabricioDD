<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Mapa de Reciclagem</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; margin-top: 50px; }
        .login-box { border: 1px solid #ccc; padding: 20px; border-radius: 8px; width: 300px; }
        input { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background-color: #218838; }
        #mensagem { color: red; margin-top: 10px; font-size: 14px; text-align: center; }
        .links { margin-top: 15px; text-align: center; font-size: 14px; }
        .links a { color: #007bff; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Entrar no Sistema</h2>
    <form id="formLogin">
        <label for="email">E-mail</label>
        <input type="email" id="email" required>
        
        <label for="senha">Senha</label>
        <input type="password" id="senha" required>
        
        <button type="submit">Entrar</button>
    </form>
    <div id="mensagem"></div>

    <!-- Novo link para a página de cadastro -->
    <div class="links">
        Não tem uma conta? <a href="cadastro.html">Cadastre-se aqui</a>
    </div>
</div>

<script>
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;
        const divMensagem = document.getElementById('mensagem');

        try {
            const resposta = await fetch('https://project3-2026b-fabriciodd.onrender.com/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email: email, senha: senha })
            });

            const dados = await resposta.json();

            if (resposta.ok) {
                localStorage.setItem('token', dados.token);
                localStorage.setItem('usuarioNome', dados.usuario.nome);
                window.location.href = 'index.html';
            } else {
                divMensagem.innerText = dados.erro;
            }
        } catch (erro) {
            divMensagem.innerText = 'Erro ao conectar com o servidor.';
        }
    });
</script>

</body>
</html>
